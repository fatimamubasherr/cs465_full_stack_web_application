<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="text-center mb-4">Add Trip</h2>
        <div *ngIf="error" class="alert alert-danger">{{error}}</div>
        <form *ngIf="addForm" [formGroup]="addForm" (ngSubmit)="onSubmit()">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Code</label><input type="text" formControlName="code" class="form-control" [class.is-invalid]="submitted && f['code'].errors"><div class="invalid-feedback">Trip code is required.</div></div>
            <div class="col-md-6"><label class="form-label">Name</label><input type="text" formControlName="name" class="form-control" [class.is-invalid]="submitted && f['name'].errors"><div class="invalid-feedback">Name is required.</div></div>
            <div class="col-md-6"><label class="form-label">Length</label><input type="text" formControlName="length" class="form-control" [class.is-invalid]="submitted && f['length'].errors"><div class="invalid-feedback">Length is required.</div></div>
            <div class="col-md-6"><label class="form-label">Start</label><input type="date" formControlName="start" class="form-control" [class.is-invalid]="submitted && f['start'].errors"><div class="invalid-feedback">Start date is required.</div></div>
            <div class="col-md-6"><label class="form-label">Resort</label><input type="text" formControlName="resort" class="form-control" [class.is-invalid]="submitted && f['resort'].errors"><div class="invalid-feedback">Resort is required.</div></div>
            <div class="col-md-6"><label class="form-label">Per Person</label><input type="text" formControlName="perPerson" class="form-control" placeholder="$1299.00" [class.is-invalid]="submitted && f['perPerson'].errors"><div class="invalid-feedback">Per-person price is required.</div></div>
            <div class="col-12"><label class="form-label">Image Name</label><input type="text" formControlName="image" class="form-control" placeholder="reef1.jpg" [class.is-invalid]="submitted && f['image'].errors"><div class="invalid-feedback">Image name is required.</div></div>
            <div class="col-12"><label class="form-label">Description</label><textarea formControlName="description" rows="5" class="form-control" [class.is-invalid]="submitted && f['description'].errors"></textarea><div class="invalid-feedback">Description is required.</div></div>
          </div>
          <div class="d-flex gap-2 mt-4"><button class="btn btn-info" type="submit">Save Trip</button><a class="btn btn-outline-secondary" routerLink="/">Cancel</a></div>
        </form>
      </div>
    </div>
  </div>
</div>
