<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <h1 class="h3 mb-1">Trip Administration</h1>
    <p class="text-muted mb-0">{{ message }}</p>
  </div>
  <button *ngIf="isLoggedIn()" class="btn btn-info" (click)="addTrip()">Add Trip</button>
</div>
<div *ngIf="!isLoggedIn()" class="alert alert-info">Log in to add, edit, or delete trips.</div>
<div *ngIf="error" class="alert alert-danger">{{ error }}</div>
<div class="row g-4">
  <div *ngFor="let trip of trips" class="col-12 col-md-6 col-lg-4">
    <app-trip-card [trip]="trip" (deleted)="onDeleted()"></app-trip-card>
  </div>
</div>
