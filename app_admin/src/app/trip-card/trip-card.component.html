<div class="card h-100 shadow-sm">
  <img [src]="'assets/images/' + trip.image" [alt]="trip.name" class="card-img-top trip-image">
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ trip.name }}</h5>
    <h6 class="card-subtitle mb-2 text-muted">{{ trip.resort }}</h6>
    <p class="small text-muted">{{ trip.length }} • {{ trip.perPerson }} per person</p>
    <div class="card-text flex-grow-1" [innerHTML]="trip.description"></div>
    <div *ngIf="isLoggedIn()" class="d-flex gap-2 mt-3">
      <button class="btn btn-primary btn-sm" (click)="editTrip()">Edit Trip</button>
      <button class="btn btn-outline-danger btn-sm" (click)="deleteTrip()" [disabled]="deleting">
        {{ deleting ? 'Deleting...' : 'Delete' }}
      </button>
    </div>
  </div>
</div>
