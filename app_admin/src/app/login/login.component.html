<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="h4 mb-3">Admin Login</h2>
        <p class="text-muted">Sign in to enable trip administration features.</p>
        <form (ngSubmit)="onLoginSubmit()">
          <div role="alert" *ngIf="formError" class="alert alert-danger">{{ formError }}</div>
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input id="name" type="text" name="name" class="form-control" placeholder="Enter name" [(ngModel)]="credentials.name">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input id="email" type="email" name="email" class="form-control" placeholder="Enter email address" [(ngModel)]="credentials.email">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" type="password" name="password" class="form-control" placeholder="Enter password" [(ngModel)]="credentials.password">
          </div>
          <button type="submit" class="btn btn-primary w-100" [disabled]="submitting">
            {{ submitting ? 'Signing in...' : 'Sign In' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
